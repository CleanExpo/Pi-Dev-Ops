name: Pipeline Smoke (E2E)

# RA-1154 — the smoke test that would have caught RA-1294.
#
# Fires one real autonomous build against prod end-to-end and asserts it
# reaches `complete` with files_modified > 0 and a PR URL. Detects the
# 305-second-generator-timeout class of regression (RA-1294 signature).
#
# UNI-2652 5+1 (A8–A10 + five consecutive + planted failure) is
# scripts/golden_journey.py — see docs/runbooks/golden-journey.md.
# This job stays one A1–A7 run; five 20-minute journeys do not fit here.
#
# Schedule: every 6 hours, so a bad deploy breaks within a quarter-day.
# Manual: `workflow_dispatch` for pre-release gating.
# Failure: pings Telegram via scripts/send_telegram.py.
#
# RA-7546 — `_sessions` is in-memory and Railway prod has no volume, so a
# mid-run redeploy wipes the smoke session. The script waits for
# authenticated /health uptime_s to pass SMOKE_SETTLE_UPTIME_S, then
# respawns. Job timeout is 45 min so a deploy cascade can drain first.
#
# Quiet-tip planner re-check (trust #750 / RA-7546 Critic):
# Do NOT mark planner CLEAR until a dispatch on a quiet main tip shows
# generate entered (A2) and no planner exit 1. How:
#   1. Railway production: no new deploy for ≥10 min (uptime_s ≥ 600,
#      or the Railway dashboard).
#   2. Actions → "Pipeline Smoke (E2E)" → Run workflow.
#   3. Paste the run URL on RA-7546.
#
# Run 35528063288 (quiet tip, uptime=23319s): planner returned 55% and
# the product 70% floor blocked generate. That is expected after #778
# (JSON-only, no tools) plus this brief's "Full feature audit first".
# intent=smoke skips the 70% floor; product plans do not. See
# planner_admission.plan_confidence_floor. Still not CLEAR from merge.

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 h
  workflow_dispatch:

jobs:
  pipeline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pipeline smoke
        id: smoke
        env:
          PI_CEO_URL:              https://pi-dev-ops-production.up.railway.app
          DASHBOARD_PASSWORD:      ${{ secrets.TAO_PROD_PASSWORD }}
          SMOKE_MAX_WAIT_S:        "1200"
          SMOKE_WALL_CLOCK_S:      "2400"
          SMOKE_SETTLE_UPTIME_S:   "90"
          SMOKE_MAX_RESPAWNS:      "2"
        # `shell: bash` runs this with `bash --noprofile --norc -eo pipefail`. GitHub's
        # default is `bash -e {0}` -- no pipefail -- so the step's status was tee's, not the
        # smoke test's. steps.smoke.outcome was therefore permanently 'success' and BOTH
        # steps below (Telegram, fail-the-job) were unreachable. The tee stays: the notify
        # step reads smoke_output.txt. continue-on-error stays too, so the Telegram step
        # still runs before the job is failed deliberately below.
        shell: bash
        run: |
          python3 scripts/smoke_test_pipeline.py | tee smoke_output.txt
        continue-on-error: true

      - name: Notify Telegram on failure
        if: steps.smoke.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_USERS:      ${{ secrets.TELEGRAM_ALLOWED_USERS }}
        run: |
          {
            echo "🚨 Pi-CEO pipeline smoke FAILED"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            tail -40 smoke_output.txt
          } | python3 scripts/send_telegram.py

      - name: Fail the job if smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
