name: Live Nexus Smoke (production)

on:
  schedule:
    # Every 4 hours, offset from the main Pi-CEO smoke jobs.
    # RA-7222 — was */2. Halved rather than cut harder because this one is a
    # GENUINE production liveness probe of live.unite-group.ink, unlike the
    # human-gated Stripe watch: reducing it trades real detection latency, so
    # worst-case time-to-notice goes 2h → 4h. ~360 → ~180 billed min/month.
    # Revisit only if an external uptime monitor covers the same URL — then
    # this job is redundant and can go to daily.
    - cron: "20 */4 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Live Nexus URL to smoke"
        required: false
        default: "https://live.unite-group.ink"
      include_save:
        description: "Also run /api/save and create a Drive smoke file"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: live-nexus

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: "10.33.0"
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: live-nexus/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Live Nexus production smoke
        env:
          LIVE_NEXUS_URL: ${{ github.event.inputs.target_url || 'https://live.unite-group.ink' }}
          LIVE_NEXUS_SMOKE_SAVE: ${{ github.event.inputs.include_save == 'true' && '1' || '0' }}
        # `shell: bash` runs this with `bash --noprofile --norc -eo pipefail`. Without it
        # GitHub's default is `bash -e {0}` -- no pipefail -- so the step's exit status is
        # tee's, not the smoke test's, and a failing probe reports success. The tee is
        # required: the `if: always()` summary step below reads live-nexus-smoke.txt.
        shell: bash
        run: |
          pnpm smoke:prod | tee live-nexus-smoke.txt

      - name: Write smoke summary
        if: always()
        run: |
          {
            echo "# Live Nexus Production Smoke"
            echo ""
            if [ -f live-nexus-smoke.txt ]; then
              echo '```'
              cat live-nexus-smoke.txt
              echo '```'
            else
              echo "No smoke output captured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
