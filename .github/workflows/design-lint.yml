name: DESIGN.md lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# RA-7222 — cancel superseded runs. Without this, pushing three times in quick
# succession runs all three sets to completion and bills every one. The group is
# keyed per workflow per ref so different PRs never cancel each other, and
# main is never cancelled (a merged commit must be fully verified).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  design-md-lint:
    name: Validate .claude/DESIGN.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Make lint script executable
        run: chmod +x .github/scripts/design-md-lint.sh
      - name: Run DESIGN.md lint
        run: bash .github/scripts/design-md-lint.sh
