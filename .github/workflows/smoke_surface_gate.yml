# smoke_surface_gate.yml — RA-1154 — block PRs that add surfaces without
# updating the surface map.
#
# Motivation: PR #48 shipped "Fix with Claude" that returned HTTP 200 but
# had no user-visible feedback. Lint + types + CI all passed because
# smoke_test.py doesn't know about new UI features. This gate catches the
# "added an interactive surface, didn't declare it in smoke-surfaces.yml"
# case at PR time, before merge.

name: Smoke Surface Gate

on:
  pull_request:
    branches: [main]
    # The three interactive prefixes the gate judges, PLUS the two files the job
    # itself reads. That second half is the rule RA-7396 established on
    # pgtap-pilot.yml: a gate that loads a file it is not triggered by goes stale
    # the first time that file changes, and nothing reports it. Adding the script
    # here also means this workflow is exercised by any PR that edits it —
    # otherwise a change to the gate ships without the gate ever having run.
    paths:
      - "dashboard/components/**"
      - "dashboard/app/api/**"
      - "app/server/routes/**"
      - ".github/workflows/smoke_surface_gate.yml"
      - ".github/scripts/smoke_surface_gate.py"
      # The manifest is read on both sides of the diff. Listing it does NOT
      # change any verdict today — a manifest-only PR adds no interactive files,
      # so the gate passes either way — but the rule is one entry per file the
      # job reads, checked by enumerating them rather than by whoever adds the
      # next step remembering. It is also the entry that would matter first if
      # this gate ever grows a check on entries being REMOVED.
      - ".github/smoke-surfaces.json"

# RA-7222 — cancel superseded runs. Without this, pushing three times in quick
# succession runs all three sets to completion and bills every one. The group is
# keyed per workflow per ref so different PRs never cancel each other, and
# main is never cancelled (a merged commit must be fully verified).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # RA-7398. This was 30 lines of inline bash whose entire test was whether
      # ".github/smoke-surfaces.json" appeared in `git diff --name-only`. It never
      # parsed the file, so ANY touch satisfied it — whitespace, a reordering, or
      # an entry for an unrelated surface. Logic that lives only in YAML also
      # cannot be run or tested locally, which is how that survived; the script
      # has tests in tests/test_smoke_surface_gate.py.
      #
      # The rule is now: only files this PR ADDED count, and the manifest's parsed
      # entry set must actually grow. Narrowing to added files is what makes
      # requiring a real entry fair — the old gate fired on every edit to an
      # existing component, which cannot honestly gain a surface entry, so a
      # cosmetic touch was the only way past.
      - name: Declared-surface gate (a new surface must be declared, not merely accompanied)
        env:
          SURFACE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/smoke_surface_gate.py
