name: Secrets scan mutation

# UNI-2651 — durable proof that the Secrets exposure scan can fail.
#
# ci.yml "Secrets exposure scan" stays green on a clean tree. A gate that is
# only ever observed green is not a gate. This job plants an invented
# AWS-shaped key in a scanned path, asserts scripts/secrets_check.py exits 1
# and names the plant, then removes it. The job is green when the scanner
# works; red means the scanner stopped being able to fail.
#
# The plant is assembled at runtime and never committed. --dry-run so this
# job cannot rewrite .gitignore or raise tickets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  mutation:
    name: Planted secret is detected then removed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run secrets_scan_mutation.py
        run: python scripts/secrets_scan_mutation.py --repo-root .
