name: pgtap-pilot

# SCOPE — read before trusting a green tick here.
#
# This job covers the PILOT migrations ONLY. The apply step below globs
# `supabase/migrations/*pilot*.sql`, and the assertions are
# `supabase/tests/pgtap/pilot_v1_isolation.sql`.
#
# The `supabase/migrations/**` path trigger is WIDER than that coverage, so a
# migration whose filename does not contain "pilot" summons this job, passes it,
# and is never applied and never asserted. Green here says nothing about such a
# migration — it is not evidence that its RLS is enabled or that its policies are
# scoped. Found the hard way: 20260831T000000_requirements_and_staging.sql
# triggered a green run of this job having never been read by it.
#
# Deliberately left as-is rather than "fixed" in passing, because both obvious
# repairs carry blast radius that belongs to a considered change, not a drive-by:
#   * Narrowing the trigger to *pilot* stops the false signal but leaves
#     non-pilot migrations with no RLS check at all.
#   * Applying every migration here can fail on pre-existing files that assume
#     extensions, roles or ordering this shadow DB does not set up — turning a
#     green gate red for reasons unrelated to whichever PR trips it.
#   * Renaming the job is not free either: if branch protection requires the
#     check by name, a rename silently drops the requirement.
# Until one is chosen, this comment is the guard: the name promises more than
# the body delivers, and now says so.
on:
  pull_request:
    paths:
      - 'swarm/pilot/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/pgtap/**'
      - '.github/workflows/pgtap-pilot.yml'
  push:
    branches: [main, feat/pilot-v1]

# RA-7222 — cancel superseded runs. Without this, pushing three times in quick
# succession runs all three sets to completion and bills every one. The group is
# keyed per workflow per ref so different PRs never cancel each other, and
# main is never cancelled (a merged commit must be fully verified).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rls-assertions:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: pilot_shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: shadow
      PGDATABASE: pilot_shadow

    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Bootstrap roles
        run: |
          psql -c "create role authenticated nologin;"
          psql -c "create role service_role nologin;"
          psql -c "grant all on schema public to authenticated, service_role;"

      - name: Apply pilot migrations
        run: |
          for f in supabase/migrations/*pilot*.sql; do
            echo "Applying $f"
            psql -f "$f"
          done

      - name: Run RLS assertions
        run: psql -f supabase/tests/pgtap/pilot_v1_isolation.sql -v ON_ERROR_STOP=1

      - name: Rollback drill (forward + drop + re-forward)
        # Bakes Discipline 4 (rollback-drill before deploy) into CI so the
        # rollback path can never silently regress. Uses the same ephemeral
        # postgres service the RLS assertions ran against — guard in the
        # script refuses any URL containing "prod" or "phill".
        env:
          SCRATCH_DB_URL: postgres://postgres:shadow@localhost:5432/pilot_shadow
        run: bash swarm/pilot/scripts/rollback_drill.sh
