name: pgtap-pilot

# SCOPE — this job covers EVERY migration plus mesh/schema, not just the pilot
# ones. It still does NOT cover tables created outside this repo; see the end.
#
# It used to apply `supabase/migrations/*pilot*.sql` — one file of seventeen —
# while triggering on all of `supabase/migrations/**`. The other sixteen summoned
# it, passed, and were never applied or asserted. Green said nothing about them.
# Found when 20260831T000000_requirements_and_staging.sql triggered a green run
# of a job that had never read it, and it had let four tables reach main with no
# RLS at all (see the baseline in rls_coverage.sql).
#
# What the apply order below requires, established by applying all 17 to a
# scratch Postgres rather than by reading them:
#   * `supabase/migration.sql` FIRST. The migrations directory is NOT
#     self-contained — 20260830T000000_session_leases.sql ALTERs `sessions`,
#     which that base file creates.
#   * The `vector` extension, for `build_episodes.embedding` in the base file.
#     Hence the pgvector image rather than stock postgres.
#   * Roles `anon`, `authenticated`, `service_role`. `anon` is new here:
#     20260827_continuation_horizons.sql grants to it.
#   * A stub `auth.uid()`. 20260512_aip_core.sql uses it in a policy, and
#     Postgres resolves that at CREATE POLICY time.
#
# `supabase/migrations/` is also not the only schema in the repo — mesh/schema/
# declares the four live mesh_* tables and nothing applied it here until
# RA-7396. It is applied below, and `mesh/schema/**` is a trigger path: a gate
# that loads a file it is not triggered by would go stale the first time that
# file changed.
#
# WHAT THIS STILL CANNOT SEE. The scratch database is built from files in this
# repo, so it only ever contains what this repo declares. 16 tables are live in
# Pi CEO and declared nowhere — a companion migration back-fills them, but the
# structural limit remains: anything created directly against production is
# invisible here, and green means "the declared schema is sound", never "the
# live database is sound". Measuring the live catalog is a separate job that
# needs credentials CI does not have (RA-7396).
#
# The job name (`rls-assertions`) and workflow name (`pgtap-pilot`) are
# deliberately unchanged: if branch protection requires a check by name, a
# rename silently drops the requirement, and that cannot be verified from here.
# The workflow filename is now cosmetically narrow — the body is what is honest.
on:
  pull_request:
    paths:
      - 'swarm/pilot/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/pgtap/**'
      - 'mesh/schema/**'
      - '.github/workflows/pgtap-pilot.yml'
  push:
    branches: [main, feat/pilot-v1]

# RA-7222 — cancel superseded runs. Without this, pushing three times in quick
# succession runs all three sets to completion and bills every one. The group is
# keyed per workflow per ref so different PRs never cancel each other, and
# main is never cancelled (a merged commit must be fully verified).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rls-assertions:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector rather than stock postgres: supabase/migration.sql declares
        # `CREATE EXTENSION vector` for build_episodes.embedding, and without it
        # the base schema cannot be applied at all. Same major version as the
        # postgres:15 image this replaces.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: pilot_shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: shadow
      PGDATABASE: pilot_shadow

    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Bootstrap roles and auth stub
        run: |
          psql -c "create role anon nologin;"
          psql -c "create role authenticated nologin;"
          psql -c "create role service_role nologin;"
          psql -c "grant all on schema public to anon, authenticated, service_role;"
          # 20260512_aip_core.sql has a policy using auth.uid(); Postgres resolves
          # that function at CREATE POLICY time, so the schema must exist first.
          psql -c "create schema auth;"
          psql -c "create function auth.uid() returns uuid language sql as \$\$ select null::uuid \$\$;"
          # auth.users, for the same reason one step further on: every cc_* table
          # back-filled by 20260901T000000_backfill_live_tables.sql declares
          # `founder_id uuid references auth.users(id) on delete cascade`, and a
          # FOREIGN KEY needs its target to exist at CREATE TABLE time. Supabase
          # provides this table; a shadow database has to stub it. Only `id` is
          # needed — nothing here reads any other column of it.
          psql -c "create table auth.users (id uuid primary key);"

      - name: Apply base schema
        # FIRST, and load-bearing: supabase/migrations/ is not self-contained.
        # 20260830T000000_session_leases.sql ALTERs `sessions`, created here.
        run: psql -v ON_ERROR_STOP=1 -f supabase/migration.sql

      - name: Apply every migration
        # ALL of them, in lexical order — filenames are date-prefixed, so lexical
        # order is chronological order. Was `*pilot*`, which matched 1 of 17.
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Apply the mesh schema
        # `supabase/migrations/` is not the only schema in this repo. The four
        # mesh_* tables are declared in mesh/schema/, cited by ADR-008 and by
        # app/server/mesh_dispatch_service.py as the schema of record — and until
        # this step existed, NOTHING applied them here, so the coverage assertion
        # below had never seen a single mesh table. They are live in production
        # and hold the fleet's work claims (RA-7396).
        #
        # Safe to apply after the migrations: every statement is
        # CREATE TABLE IF NOT EXISTS, and the file's only role dependency is
        # service_role, created in the bootstrap step above.
        run: |
          for f in mesh/schema/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run pilot RLS assertions
        run: psql -f supabase/tests/pgtap/pilot_v1_isolation.sql -v ON_ERROR_STOP=1

      - name: Run RLS coverage assertions
        # Catalog-wide: every public table needs RLS AND a policy, with a
        # shrink-only baseline for what is already broken. This is the check that
        # covers a new table by it existing, rather than by being remembered.
        run: psql -f supabase/tests/pgtap/rls_coverage.sql -v ON_ERROR_STOP=1

      - name: Rollback drill (forward + drop + re-forward)
        # Bakes Discipline 4 (rollback-drill before deploy) into CI so the
        # rollback path can never silently regress. Uses the same ephemeral
        # postgres service the RLS assertions ran against — guard in the
        # script refuses any URL containing "prod" or "phill".
        env:
          SCRATCH_DB_URL: postgres://postgres:shadow@localhost:5432/pilot_shadow
        run: bash swarm/pilot/scripts/rollback_drill.sh
