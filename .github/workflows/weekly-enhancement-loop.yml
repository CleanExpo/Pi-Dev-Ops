name: Weekly Enhancement Loop

# 8-Claude-Loops improve-system pass across every repo in .harness/projects.json.
# Opens a review PR per repo; never merges. Model ladder runs on OpenRouter
# (Claude Opus/Sonnet/Haiku via its Anthropic /v1/messages surface) because
# Fable-5 left the Max plan on 2026-07-08 and the direct Anthropic org has no
# API credit. The runner is a self-contained tool-use agent — no Claude Code CLI.
#
# Monday 02:00 AEST (UTC+10, no DST) == Sunday 16:00 UTC.
on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:
    inputs:
      repo:
        description: "Single repo (owner/name); blank = all"
        required: false
      dry_run:
        description: "Commit locally, do not push/PR"
        type: boolean
        default: false

concurrency:
  group: weekly-enhancement-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enhance:
    # Guard: only the canonical repo runs this schedule (avoids fork triggers).
    if: github.repository == 'CleanExpo/Pi-Dev-Ops'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # OpenRouter credit funds the Claude model ladder (direct Anthropic org has
      # no API credit; Max OAuth is gone post-2026-07-08).
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # PAT with repo scope across the CleanExpo org so the loop can clone the
      # other 10 private repos and open PRs. GITHUB_TOKEN cannot reach them.
      GH_ENHANCE_PAT: ${{ secrets.GH_ENHANCE_PAT }}
      # Cost-optimised open-weight ladder (founder directive 2026-07-05): cheap
      # open-weight grunt tiers + one stronger open-weight reasoner reserved for
      # the planner handoff. ~$0.4/repo vs ~$8/repo on Opus/Sonnet/Haiku.
      ENHANCE_MODEL_HANDOFF: deepseek/deepseek-v4-pro
      ENHANCE_MODEL_BUILD: qwen/qwen3-coder-30b-a3b-instruct
      ENHANCE_MODEL_REVIEW: deepseek/deepseek-v4-flash
      ENHANCE_MODEL_SCAN: qwen/qwen3-235b-a22b-2507
      # Real spend now projects ~$5 for the full 10-repo run; keep a tight ceiling
      # as the circuit-breaker (was 40 for the premium ladder).
      TAO_MAX_COST_USD: "15.00"
    steps:
      - name: Checkout Pi-Dev-Ops
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run weekly enhancement loop
        run: |
          python scripts/weekly_enhancement_loop.py \
            ${{ github.event.inputs.repo && format('--repo {0}', github.event.inputs.repo) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhancement-loop-log
          path: .harness/enhancement-loop/*.jsonl
          if-no-files-found: ignore
