name: Weekly Enhancement Loop

# 8-Claude-Loops improve-system pass across every repo in .harness/projects.json.
# Opens a review PR per repo; never merges. Model ladder runs API-mode
# (Opus/Sonnet/Haiku) because Fable-5 left the Max plan on 2026-07-08.
#
# Monday 02:00 AEST (UTC+10, no DST) == Sunday 16:00 UTC.
on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:
    inputs:
      repo:
        description: "Single repo (owner/name); blank = all"
        required: false
      dry_run:
        description: "Commit locally, do not push/PR"
        type: boolean
        default: false

concurrency:
  group: weekly-enhancement-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enhance:
    # Guard: only the canonical repo runs this schedule (avoids fork triggers).
    if: github.repository == 'CleanExpo/Pi-Dev-Ops'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # Real sk-ant-api key (NOT a Max OAuth token) — API-mode billing.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # PAT with repo scope across the CleanExpo org so the loop can clone the
      # other 10 private repos and open PRs. GITHUB_TOKEN cannot reach them.
      GH_ENHANCE_PAT: ${{ secrets.GH_ENHANCE_PAT }}
      ENHANCE_MODEL_OPUS: claude-opus-4-6
      ENHANCE_MODEL_SONNET: claude-sonnet-4-6
      ENHANCE_MODEL_HAIKU: claude-haiku-4-5-20251001
      TAO_MAX_COST_USD: "40.00"
    steps:
      - name: Checkout Pi-Dev-Ops
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Claude Agent SDK + CLI
        run: |
          pip install claude-agent-sdk
          npm install -g @anthropic-ai/claude-code

      - name: Run weekly enhancement loop
        run: |
          python scripts/weekly_enhancement_loop.py \
            ${{ github.event.inputs.repo && format('--repo {0}', github.event.inputs.repo) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhancement-loop-log
          path: .harness/enhancement-loop/*.jsonl
          if-no-files-found: ignore
