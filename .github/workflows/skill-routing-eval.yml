name: Skill routing eval (Jev)

# Scores the skill router on the labelled corpus (evals/skill_routing/corpus.jsonl) with live
# Jev calls. Metered and secret-bearing, so it runs ONLY by hand, and only on the exact
# commit the person dispatching it names. Every call is reserved against a dollar cap first.
#
# Why no pull_request trigger: a label survives new pushes, so a labelled PR re-ran every
# later head with TYPESAFE_API_KEY, code nobody had looked at (review P1-PR-SECRET-TO-HEAD-CODE).
# A dispatch names one reviewed SHA; any other checkout stops before the secret is used.
#
# 1. tune split: shortlist sizes 20, 100 and 254 (Jev's per-question option limit)
# 2. the size with the best tune top-1 is then scored ONCE on the held-out split; that
#    held-out number is the one reported. Nothing is tuned on held-out.
# The library's skills come from CleanExpo/skills-library at the SHA in skills-library.lock.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full 40-char commit SHA you reviewed; the run stops if the branch head differs"
        required: true
      cap_usd:
        description: "Dollar cap for this run"
        default: "5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jev-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CAP_USD: ${{ inputs.cap_usd }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Stop unless this is exactly the reviewed commit
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_sha must be a full 40-char SHA"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] || { echo "checked out $(git rev-parse HEAD), not $EXPECTED_SHA"; exit 1; }

      - name: Read the pinned skills-library SHA
        id: lib
        run: echo "sha=$(head -1 skills-library.lock)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: CleanExpo/skills-library
          ref: ${{ steps.lib.outputs.sha }}
          token: ${{ secrets.SKILLS_LIBRARY_READ_TOKEN }}
          path: _skills-library
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r app/requirements.lock

      - name: Tune split, three shortlist sizes
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          mkdir -p reports
          for k in 20 100 254; do
            python -m evals.skill_routing.run --library _skills-library --split tune --jev \
              --ledger reports/ledger.sqlite --cap-usd "$CAP_USD" --k "$k" \
              --out "reports/tune-k$k.json" --rows-out "reports/tune-k$k.rows.jsonl" > /dev/null
          done

      - name: Held-out split, best tune size only
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          best=$(python -c "import json;print(max((20,100,254),key=lambda k:json.load(open(f'reports/tune-k{k}.json'))['jev']['top1_accuracy']))")
          echo "best tune shortlist size: $best"
          python -m evals.skill_routing.run --library _skills-library --split heldout --jev \
            --ledger reports/ledger.sqlite --cap-usd "$CAP_USD" --k "$best" \
            --out reports/heldout.json --rows-out reports/heldout.rows.jsonl > /dev/null

      - name: Summary
        if: always()
        run: python -m evals.skill_routing.summary reports >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-routing-reports
          path: reports/
