# Hourly Stripe-key watch for CleanExpo/DR-NRPG (egress-proof).
#
# Cloud Agent sandboxes with default network policy cannot reach *.vercel.app.
# This workflow runs on GitHub-hosted runners (full egress) so the watch keeps
# firing even when the Cursor automation environment is not allowlisted yet.
#
# Exit 1 (infrastructure) fails the job. Exit 2/3 (missing keys) are reported
# but do not fail CI — keys are human-gated per STRIPE-SETUP-FOR-RANA.md.

name: DR-NRPG Stripe Watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe DR-NRPG Stripe configuration
        run: |
          set +e
          python3 scripts/probe_dr_nrpg_stripe_keys.py --json | tee /tmp/probe.json
          code=$?
          exit_code=$(python3 -c "import json; print(json.load(open('/tmp/probe.json'))['exit_code'])")
          if [ "$exit_code" = "1" ]; then
            echo "::error::Probe could not reach dr-nrpg-platform.vercel.app"
            exit 1
          fi
          echo "Probe finished with exit_code=$exit_code (0=all green, 2=secret key missing, 3=webhook missing)"
          exit 0
