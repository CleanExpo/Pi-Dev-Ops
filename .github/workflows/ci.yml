name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# RA-7222 — cancel superseded runs. Without this, pushing three times in quick
# succession runs all three sets to completion and bills every one. The group is
# keyed per workflow per ref so different PRs never cancel each other, and
# main is never cancelled (a merged commit must be fully verified).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Lint: ruff, isolated ────────────────────────────────────────────────────
  # Deliberately its own job. Ruff previously ran as the first step of the
  # `python` job, so a lint error exited before pytest and skipped all five
  # downstream steps — the unit tests, the swarm tests and both gates. Main sat
  # red on one unused import while 18 real test failures stayed invisible.
  # A lint error must never be able to blank the test suite again.
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff==0.15.10"

      - name: Ruff lint
        run: ruff check app/ --output-format=github

  # ── Python: unit tests + gates ──────────────────────────────────────────────
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TAO_PASSWORD: ci-test-password
      TAO_SESSION_SECRET: ci-session-secret-fixed-for-test
      TAO_EVALUATOR_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install "pytest>=8"

      - name: Pytest unit tests
        run: pytest tests/ -v --tb=short
        working-directory: .

      - name: Pytest swarm tests
        run: pytest swarm/ -v --tb=short
        working-directory: .

      - name: AIP MCP wrapper tests
        run: bash aip/src/mcp/test_run.sh
        working-directory: .

      - name: Provisioning gate (RA-7015 Cap 0)
        run: python scripts/check_provisioning.py
        working-directory: .

      - name: Nexus shadow agent registry gate
        run: python scripts/check_agent_registry.py
        working-directory: .

      # A declared-but-unresolvable business_charter silently becomes charter_text=""
      # in discovery.py and workspace_context.py, so a generated session builds with an
      # empty business brain. Ratchet: the seven currently-missing are tolerated, new
      # ones fail.
      - name: Business charter gate
        run: python scripts/check_business_charters.py
        working-directory: .

      # RA-7252: a PR can edit a SKILL.md and merge without regenerating the
      # manifest — main carried stale content for weeks and nothing here noticed,
      # because the `generated-agentskills` gate existed only in handoff-loop.sh,
      # which runs on a laptop at handoff time. Regeneration is idempotent (no
      # version bump or history append when nothing changed), so a clean tree is
      # the correct success condition. Invoked as a MODULE deliberately: the
      # script-path form cannot resolve its relative imports and writes nothing,
      # which would leave this diff check passing on stale content.
      - name: Agentskills manifest gate (RA-7252)
        run: |
          python -m swarm.agentskills_manifest
          if ! git diff --exit-code -- agentskills.json agentskills.yaml; then
            echo "::error::agentskills manifest is stale — a SKILL.md changed without regeneration. Fix with: python3 -m swarm.agentskills_manifest (then commit agentskills.json and agentskills.yaml)"
            exit 1
          fi
        working-directory: .

  # ── Frontend: TypeScript + ESLint + build ────────────────────────────────────
  frontend:
    name: Frontend (tsc + eslint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint
        continue-on-error: false

      - name: Build
        run: npm run build
        env:
          # Stub required env vars for build validation
          PI_CEO_URL: http://127.0.0.1:7777
          PI_CEO_PASSWORD: ci-build-stub
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-key

  # ── Secrets exposure scan (runs on every push + PR, blocks merge) ──────────
  secrets-scan:
    name: Secrets exposure scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history so git ls-files works correctly
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run secrets_check.py
        run: python scripts/secrets_check.py --repo-root .
        # No LINEAR_API_KEY / TELEGRAM_BOT_TOKEN in CI — alerts fire in local + prod only.
        # A non-zero exit code from secrets_check.py fails the job and blocks the merge.

  # ── RA-583: Post-deploy smoke test against production Railway URL ──────────
  # Runs only on pushes to main (not PRs) after both python + frontend jobs pass.
  # Requires TAO_PROD_PASSWORD secret set in GitHub → Settings → Secrets.
  smoke-prod:
    name: Smoke test (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [python, frontend, secrets-scan]
    # Only fire on pushes to main — not on PRs (we don't smoke prod on every PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps for smoke test
        run: pip install requests

      - name: Wait for Railway deploy to settle
        # CI jobs take ~44s before this runs; Railway deploy needs ~60-90s total.
        # 60s here + 44s CI overhead = ~104s total settle time.
        run: sleep 60

      - name: Run smoke test against production
        run: python scripts/smoke_test.py --target=prod --emit-metrics
        env:
          TAO_PASSWORD: ${{ secrets.TAO_PROD_PASSWORD }}

      - name: Upload smoke test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-metrics
          path: .harness/post-deploy-metrics/
          if-no-files-found: ignore

  # ── RA-6503: Local smoke test in CI (every PR + push to main) ─────────────
  # Starts the server locally with a dummy TAO_PASSWORD and runs
  # scripts/smoke_test.py against it. Does NOT hit production.
  # Runs on every PR so smoke regressions are caught before merge.
  # Excluded checks (see PR body for full rationale):
  #   --agent-sdk checks  — require ANTHROPIC_API_KEY secret, not set in PR CI
  #   --emit-metrics      — post-deploy metric files not meaningful in PR runs
  smoke-local:
    name: Smoke test (local server, RA-6503)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [python]

    env:
      TAO_PASSWORD: ci-smoke-local-dummy-password
      TAO_SESSION_SECRET: ci-session-secret-fixed-for-test
      TAO_EVALUATOR_ENABLED: "false"
      TAO_GC_MAX_AGE: "3600"
      TAO_SWARM_ENABLED: "0"
      TAO_AUTONOMY_ENABLED: "0"
      # TAO_AUTONOMY_ENABLED gates the Linear poller, NOT cron. Without this the
      # startup catch-up in cron_loop fires every trigger whose last_fired_at is
      # older than its schedule — and in a fresh checkout that value comes from
      # git, so CI runs a real board meeting (live model calls) and real script
      # triggers on every smoke run. A gate must measure, not act.
      TAO_CRON_ENABLED: "0"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Start Pi CEO server locally
        run: |
          python -m uvicorn app.server.main:app \
            --host 127.0.0.1 --port 7777 \
            --log-level warning > /tmp/server-local.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:7777/health 2>/dev/null || echo "000")
            echo "[${i}s] health status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "=== SERVER STARTUP LOG ==="
          cat /tmp/server-local.log
          echo "=========================="
          exit 1

      - name: Run smoke test against local server
        # --agent-sdk excluded: requires ANTHROPIC_API_KEY (not set in PR CI)
        # --emit-metrics excluded: post-deploy metrics not meaningful here
        run: |
          python scripts/smoke_test.py \
            --url http://127.0.0.1:7777 \
            --password "$TAO_PASSWORD"

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/server-local.log || true

      - name: Stop server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true
