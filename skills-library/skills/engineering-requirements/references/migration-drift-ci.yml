# Migration drift check — drop-in GitHub Actions workflow.
#
# Copy to .github/workflows/migration-drift.yml in any repo with a migration ledger, and set the
# DRIFT_DB_URL secret to a read-only connection string.
#
# TWO JOBS, NOT ONE, AND THE CRON IS THE IMPORTANT ONE.
# A pre-merge check only fires when someone pushes. The ATO failure produced no git activity at
# all for five and a half months: the migration was merged on 2026-02-12, never applied, and
# nothing pushed afterwards would have noticed because nothing compared the two sides. Drift is a
# state, not an event, so something must ask on a timer.

name: migration-drift

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h, offset off the hour so it does not queue behind everyone
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migration-drift.yml"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the check reads origin/main, not the PR head

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Fetch the drift check
        run: |
          mkdir -p .drift
          curl -fsSL "$DRIFT_CHECK_URL" -o .drift/migration_drift.py
        env:
          # Vendor this file into the repo instead if you would rather not fetch it at run time.
          DRIFT_CHECK_URL: ${{ vars.DRIFT_CHECK_URL }}

      # POSITIVE CONTROL, AND IT RUNS FIRST ON PURPOSE.
      # A drift check that has never failed is indistinguishable from one that cannot fail. If the
      # control does not pass, the real run below is not trustworthy and this job stops here.
      - name: Positive control
        run: python3 .drift/migration_drift.py self-test

      - name: Check for drift
        env:
          DRIFT_DB_URL: ${{ secrets.DRIFT_DB_URL }}
        run: |
          set -o pipefail
          python3 .drift/migration_drift.py check \
            --root . \
            --migrations-dir supabase/migrations \
            --ref origin/main \
            --db-url "$DRIFT_DB_URL"
          status=$?
          # 0 in sync, 1 drift, 2 cannot determine. Two is a FAILURE, never a skip: a job that
          # cannot reach the database and reports success is the same silent fail-open this check
          # exists to catch. Do not add `continue-on-error` here.
          exit $status

# WHAT BREAKS THIS IN PRACTICE
# Connectivity. Expired credentials, an IP allowlist, a network blip — the job errors, and if
# anyone "fixes" the noise by treating a non-zero exit as skippable, the check is decorative from
# that day on. Exit 2 exists to make that failure loud and separately attributable from real drift.
#
# The second failure mode is a repo whose filenames carry no numeric version prefix. Those files
# cannot be compared and are reported as such rather than silently ignored — if that list is long,
# the fix is a naming convention, not a looser check.
