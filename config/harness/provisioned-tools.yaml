# Provisioned-tools SSOT — RA-7015 Cap 0 provisioning gate.
# Single source of truth for which tools skills/agents/services may build against.
# Derived from ~/.claude/skills/library/connections.md and
# .harness/connections-audit-2026-05-08.md. Enforced by scripts/check_provisioning.py.
#
# Two halves:
#   banned[]       -> BLOCKING. Any mention in a scanned surface fails CI. Needs no
#                     declarations to detect (greps wiring directly).
#   provisioned[]  -> REPORT-ONLY reconciliation against agentskills.json
#                     dependencies.tools[]. Dormant until those are populated
#                     (0/149 skills declare tools as of 2026-07-09).
version: 1
updated: "2026-07-09"
source_of_truth: "~/.claude/skills/library/connections.md"

provisioned:
  - name: anthropic
    aliases: ["claude", "claude code", "claude-agent-sdk"]
  - name: supabase
  - name: semrush
  - name: vercel
    note: "OIDC / claude.ai connector. CLI parked on dead zenithfresh25-1436 — re-auth to unite-group team before any CLI use (RA-7015)."
  - name: elevenlabs
    note: "~/.hermes/.env ELEVENLABS_API_KEY; TTS via REST."
  - name: artlist
    aliases: ["artlist ai toolkit", "nano banana"]
    note: "PRIMARY image/video substrate. Explicitly NOT Higgsfield (connections.md:56)."
  - name: openrouter
    constraint: "Sub-agent tasks ONLY — never primary work (06-11 mandate)."
    note: "PROVISIONED (Hermes .env, 2 keys; connections-audit Tier 1). Corrects RA-7015's 'not provisioned' premise — does NOT block Cap 1."

banned:
  - name: higgsfield
    reason: "Image/video — use Artlist instead (connections.md:56)."
  - name: zapier
    reason: "No third-party workflow tool — build posting on our own MCP/skills (RA-7015)."
  - name: blotato
    reason: "Assumed posting tool, never provisioned — decide posting substrate first (RA-7015)."

# Surfaces scanned for banned tokens: skill/agent/service WIRING only.
# Excludes design-system reference folders (remotion-studio/**/_library names a
# UI style 'zapier' that is not a tool integration — would be a false positive).
scan:
  include:
    - "skills/**/*.md"
    - "agentskills.json"
    - "swarm/**/*.py"
    - "app/server/**/*.py"
  exclude:
    - "remotion-studio/**"
    - "**/node_modules/**"
    - "**/.venv/**"
