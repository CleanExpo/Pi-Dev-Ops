version: 1
agents:
  - id: scout
    purpose: Map the repository, prior decisions, relevant files, constraints, and unresolved assumptions without mutation.
    model_policy_role: monitor
    risk_tier_ceiling: 0
    skills: [architecture]
    evidence: [repository-map, constraints-report]
    status: shadow
  - id: planner
    purpose: Produce dependency-aware implementation plans, risks, and acceptance tests before build work starts.
    model_policy_role: planner
    risk_tier_ceiling: 0
    skills: [forward-planner, technical-plan]
    evidence: [implementation-plan, acceptance-tests]
    status: shadow
  - id: builder
    purpose: Implement an approved bounded slice inside an isolated workspace using test-driven development.
    model_policy_role: generator
    risk_tier_ceiling: 1
    skills: [architecture, tao-tdd-pipeline]
    evidence: [git-diff, focused-tests]
    status: shadow
  - id: verifier
    purpose: Run tests, lint, builds, smoke checks, and capture reproducible exact-command evidence.
    model_policy_role: evaluator
    risk_tier_ceiling: 0
    skills: [verify-test]
    evidence: [test-results, lint-results, build-results]
    status: shadow
  - id: reviewer
    purpose: Independently review candidate code and architecture without editing the candidate workspace.
    model_policy_role: evaluator
    risk_tier_ceiling: 0
    skills: [agentic-review]
    evidence: [review-verdict, file-line-findings]
    status: shadow
  - id: security
    purpose: Review secrets, authentication, dependencies, network access, permissions, and fail-closed behaviour.
    model_policy_role: evaluator
    risk_tier_ceiling: 0
    skills: [security-audit]
    evidence: [security-report, secret-scan]
    status: shadow
  - id: ci-recovery
    purpose: Classify failing CI gates and perform bounded reversible repairs without weakening or bypassing a gate.
    model_policy_role: generator
    risk_tier_ceiling: 1
    skills: [unite-group-ci-recovery]
    evidence: [failure-classification, repair-evidence]
    status: shadow
  - id: release-monitor
    purpose: Observe release readiness and health, then provide rollback advice without merge or deployment authority.
    model_policy_role: monitor
    risk_tier_ceiling: 0
    skills: [deployment, ship-release]
    evidence: [health-observation, rollback-advice]
    status: shadow
