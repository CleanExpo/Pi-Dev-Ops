# Expert-labelled calibration set — Prove-It Gate slice 3a (RA-7014).
#
# 30 cases the judge is measured against. Each: a {message, assigned_intent} pair
# and the EXPERT verdict (correct = the intent is right for the message). The
# calibration runner (run_calibration.py) runs the judge N times per case and
# checks judge↔expert disagreement < 20% AND run-to-run flip-rate < 20% before the
# gate may go blocking. Balanced (15 correct / 15 mislabelled) so a one-sided judge
# can't pass. Intents: research | ticket | reply | reminder | flow | unknown.
rubric: |
  The candidate is a JSON object {message, assigned_intent}. Valid intents:
  research (question/lookup/deep-dive), ticket (file/track a bug or task),
  reply (draft a response to someone), reminder (schedule a time-based nudge),
  flow (run a multi-step automation), unknown (ambiguous / low-confidence / PII).
  PASS if assigned_intent is the single best fit; FAIL if another intent clearly
  fits better, or an ambiguous message was not marked unknown.
cases:
  # ---- correct (expert: PASS) ----
  - {id: r1, message: "what's the status of the CCW migration?", assigned_intent: research, correct: true}
  - {id: r2, message: "look up Vercel Workflow DevKit pricing", assigned_intent: research, correct: true}
  - {id: r3, message: "deep dive on ANZ restoration insurance regulation", assigned_intent: research, correct: true}
  - {id: t1, message: "file a bug: dashboard widget renders blank on Safari", assigned_intent: ticket, correct: true}
